name: jmethodID probe
on: [push, workflow_dispatch]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15]
        java: ['17', '21', '25']
        distribution: [temurin]
        include:
          - os: ubuntu-24.04-arm
            java: '21'
            distribution: zulu
          - os: ubuntu-24.04-arm
            java: '21'
            distribution: corretto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: allocators
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libjemalloc2 libgoogle-perftools4 libmimalloc2.0 2>/dev/null || sudo apt-get install -y -q libjemalloc2 libgoogle-perftools4
      - name: kernel
        if: runner.os == 'Linux'
        run: |
          uname -a
          (grep -h CONFIG_ARM64_VA_BITS /boot/config-$(uname -r) 2>/dev/null || true)
          cat /proc/sys/vm/legacy_va_layout
      - name: probe
        run: ./run.sh "$JAVA_HOME"
